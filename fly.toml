# Fly.io config for a single-user Planner. Exactly one machine: SQLite has a single writer.
app = "planner-CHANGE-ME"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_TIMEZONE = "America/New_York"
  PUBLIC_BASE_URL = "https://planner-CHANGE-ME.fly.dev"
  AUTH_MODE = "password"
  TELEGRAM_MODE = "webhook"
  TRUST_PROXY = "true"
  GOOGLE_CALENDAR_IDS = "primary"

[[mounts]]
  source = "planner_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the sync scheduler runs in-process and webhooks must answer quickly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
